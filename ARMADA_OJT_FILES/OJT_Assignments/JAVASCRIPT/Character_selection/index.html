<!DOCTYPE html>
<html lang="en">
<head>
    <title>Valorant Style Agent Select</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- LEFT FLEX AGENTS -->
    <main>

        <div class="agent"
            data-name="VIPER"
            data-role="CONTROLLER"
            data-image="assets/img/viper.avif"
            data-description="The American Chemist, Viper deploys an array of poisonous chemical devices to control the battlefield."
            data-ability="viperAbility">
            <img src="assets/img/viper.avif">
            <audio src="assets/audio/viperr.mp4" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="CLOVE"
            data-role="CONTROLLER"
            data-image="assets/img/clobe.avif"
            data-description="Scottish troublemaker Clove keeps foes guessing even from beyond the grave."
            data-ability="cloveAbility">
            <img src="assets/img/clobe.avif">
            <audio src="assets/audio/clove.webm" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="SAGE"
            data-role="SENTINEL"
            data-image="assets/img/sage.avif"
            data-description="Sage creates safety for herself and her team wherever she goes."
            data-ability="sageAbility">
            <img src="assets/img/sage.avif">
            <audio src="assets/audio/sage.webm" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="DEADLOCK"
            data-role="CONTROLLER"
            data-image="assets/img/deadlock.avif"
            data-description="Deadlock deploys cutting-edge nanowire to secure the battlefield."
            data-ability="deadlockAbility">
            <img src="assets/img/deadlock.avif">
            <audio src="assets/audio/deadlock.mp4" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="KILLJOY"
            data-role="INITIATOR"
            data-image="assets/img/kj.png"
            data-description="Killjoy secures the battlefield with her arsenal of inventions."
            data-ability="killjoyAbility">
            <img src="assets/img/kj.png">
            <audio src="assets/audio/killjoy.mp4" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="REYNA"
            data-role="DUELIST"
            data-image="assets/img/reyna.png"
            data-description="Reyna dominates single combat with her raw skill."
            data-ability="reynaAbility">
            <img src="assets/img/reyna.png">
            <audio src="assets/audio/reyna.mp4" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="RAZE"
            data-role="CONTROLLER"
            data-image="assets/img/raze.avif"
            data-description="Raze excels at clearing tight spaces with explosive gameplay."
            data-ability="razeAbility">
            <img src="assets/img/raze.avif">
            <audio src="assets/audio/raze.mp4" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="VYSE"
            data-role="SENTINEL"
            data-image="assets/img/vyse.avif"
            data-description="Vyse isolates, traps, and disarms her enemies."
            data-ability="vyseAbility">
            <img src="assets/img/vyse.avif">
            <audio src="assets/audio/vyse.mp4" preload="auto"></audio>
        </div>

        <div class="agent"
            data-name="SKYE"
            data-role="INITIATOR"
            data-image="assets/img/skye.png"
            data-description="Skye and her band of beasts trail-blaze the way through hostile territory."
            data-ability="skyeAbility">
            <img src="assets/img/skye.png">
            <audio src="assets/audio/skye.mp4" preload="auto"></audio>
        </div>

    </main>

    <!-- RIGHT DISPLAY -->
    <section class="display">
        <div class="display-content">
            <img id="main-image" src="">
            <div class="agent-name" id="agent-name">SELECT VALORANT AGENT</div>
            <div class="role" id="agent-role"></div>
            <div class="description" id="agent-description"></div>
            <div class="ability" id="agent-ability"></div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
