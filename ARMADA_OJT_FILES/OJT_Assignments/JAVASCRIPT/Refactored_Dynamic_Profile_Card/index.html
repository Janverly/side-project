<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <title>Refactored Dynamic Profile Card</title>
</head>
<body>

    <div id="notificationContainer"></div>

    <div id="profileCard">
        <img id="profileImage" src="img/john_doe.webp" alt="Profile Picture">
        <h2 id="profileName">John Doe</h2>
        <p id="profileBio">Web developer who loves coffee</p>
    </div>

    <div class="controls">
        <input type="text" id="nameInput" placeholder="New name">
        <input type="text" id="bioInput" placeholder="New bio">
        <input type="text" id="imageInput" placeholder="Image URL">
        <input type="color" id="bgColorInput">
        <button id="updateProfileBtn">Update Profile Card</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
