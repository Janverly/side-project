<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Agent Selection</title>

        <!-- jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

        <!-- jQuery UI -->
        <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>

        <!-- Slick Carousel -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/slick-carousel/1.8.1/slick.min.js"></script>

        <!-- Magnific Popup -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/magnific-popup.min.css"/>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/magnific-popup.js/1.1.0/jquery.magnific-popup.min.js"></script>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <section class="all">
            <h1>SELECT YOUR AGENT</h1>
            <p>Choose your Valorant Agent</p>
        </section>

        <section class="agents">
            <div class="slider">

                <div class="card" data-name="Fade" data-desc="Turkish bounty hunter, Fade, unleashes the power of raw nightmares to seize enemy secrets. Attuned with terror itself, she hunts targets and reveals their deepest fears--before crushing them in the dark.">
                    <a href="img/agent1.png" class="popup">
                        <img src="img/agent1.png">
                    </a>
                    <h3>Fade</h3>
                    <p>Initiator</p>
                </div>

                <div class="card" data-name="Clove" data-desc="Scottish troublemaker Clove makes mischief for enemies in both the heat of combat and the cold of death. The young immortal keeps foes guessing, even from beyond the grave, their return to the living only ever a moment away.">
                    <a href="img/agent2.png" class="popup">
                        <img src="img/agent2.png">
                    </a>
                    <h3>Clove</h3>
                    <p>Controller</p>
                </div>

                <div class="card" data-name="Astra" data-desc="Ghanaian Agent Astra harnesses the energies of the cosmos to reshape battlefields to her whim. With full command of her astral form and a talent for deep strategic foresight, she's always eons ahead of her enemy's next move.">
                    <a href="img/agent3.png" class="popup">
                        <img src="img/agent3.png">
                    </a>
                    <h3>Astra</h3>
                    <p>Controller</p>
                </div>

                <div class="card" data-name="Reyna" data-desc="Forged in the heart of Mexico, Reyna dominates single combat, popping off with each kill she scores. Her capability is only limited by her raw skill, making her highly dependent on performance.">
                    <a href="img/agent4.png" class="popup">
                        <img src="img/agent4.png">
                    </a>
                    <h3>Reyna</h3>
                    <p>Duelist</p>
                </div>

                <div class="card" data-name="Sage" data-desc="The stronghold of China, Sage creates safety for herself and her team wherever she goes. Able to revive fallen friends and stave off aggressive pushes, she provides a calm center to a hellish fight.">
                    <a href="img/agent5.png" class="popup">
                        <img src="img/agent5.png">
                    </a>
                    <h3>Sage</h3>
                    <p>Sentinel</p>
                </div>

                <div class="card" data-name="Viper" data-desc="The American Chemist, Viper deploys an array of poisonous chemical devices to control the battlefield and choke the enemy's vision. If the toxins don't kill her prey, her mindgames surely will.">
                    <a href="img/agent6.png" class="popup">
                        <img src="img/agent6.png">
                    </a>
                    <h3>Viper</h3>
                    <p>Controller</p>
                </div>

            </div>
        </section>

        <section class="details">
            <h2 id="agentTitle">Agent Description</h2>
            <img id="agentImage" src="">
            <p id="agentDesc">Click an agent to see details.</p>
        </section>

        <script src="script.js"> </script>

    </body>
</html>
