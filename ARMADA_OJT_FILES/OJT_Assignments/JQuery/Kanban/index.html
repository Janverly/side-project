<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Kanban Board</title>
    <link rel="stylesheet" href="assets/css/style.css">

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://code.jquery.com/ui/1.13.2/jquery-ui.min.js"></script>
</head>

    <body>

        <header>
            <h2>Simple Kanban Board</h2>
        </header>

        <main class="board">

            <section class="column">
                <h3>To Do</h3>
                <div class="task-list connected">
                    <div class="task">
                        <img src="assets/img/profile1.png" alt="User Avatar">
                        <p>Form Validation Activity</p>
                    </div>

                    <div class="task">
                        <img src="assets/img/profile2.png" alt="User Avatar">
                        <p>Cool Plugins Activity</p>
                    </div>
                </div>
            </section>

            <section class="column">
                <h3>In Progress</h3>
                <div class="task-list connected">
                    <div class="task">
                        <img src="assets/img/profile4.png" alt="User Avatar">
                        <p>Kanban</p>
                    </div>
                </div>
            </section>

            <section class="column">
                <h3>For Approval</h3>
                <div class="task-list connected">
                    <div class="task">
                        <img src="assets/img/profile3.png" alt="User Avatar">
                        <p>Java Spring Activities</p>
                    </div>

                    <div class="task">
                        <img src="assets/img/profile1.png" alt="User Avatar">
                        <p>jQuery Activities</p>
                    </div>
                </div>
            </section>

            <section class="column">
                <h3>Testing</h3>
                <div class="task-list connected">
                    <div class="task">
                        <img src="assets/img/profile2.png" alt="User Avatar">
                        <p>Matchy Matchy! Activity</p>
                    </div>

                    <div class="task">
                        <img src="assets/img/profile2.png" alt="User Avatar">
                        <p>Fortune Cookie Activity</p>
                    </div>
                </div>
            </section>

            <section class="column">
                <h3>Done</h3>
                <div class="task-list connected"></div>
            </section>

        </main>

    <script src="assets/js/script.js"></script>

</body>
</html>
