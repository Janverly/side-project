            alert('Claim it!');

            $('body').append('<h3>Each day I am getting closer to be hirable developer.</h3>');
            $('h3').click( function() {
                alert('Claim it!');   //This is the callback that executes only every time the button is clicked!
            });
        });
    });
</script>
<body>
